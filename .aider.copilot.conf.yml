# Lead Developer profile.
# GitHub Copilot is the provider; the model performs the Claude Lead role.

model: github_copilot/claude-sonnet-4.5

git: true
gitignore: false
aiderignore: .aiderignore

auto-commits: false
dirty-commits: false
attribute-author: false
attribute-committer: false
attribute-commit-message-author: false
attribute-commit-message-committer: false
attribute-co-authored-by: false
git-commit-verify: true

auto-accept-architect: false
show-diffs: true
analytics-disable: true

read:
  - AGENTS.md
  - docs/agents/claude-lead.md
  - docs/architecture/system.md
  - docs/agents/workflow.md
  - docs/agents/authority-matrix.md
  - docs/agents/approval-gates.md
  - docs/agents/handoff-protocol.md
  - docs/engineering/code-quality.md
  - docs/engineering/documentation-policy.md
  - docs/engineering/git-policy.md
  - docs/engineering/dependency-policy.md

lint-cmd: pnpm lint
test-cmd: pnpm test
auto-lint: false
auto-test: false
