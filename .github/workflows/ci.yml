name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm roadmap:check
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @pokenexus/game-data sanity:current
      - run: pnpm --filter @pokenexus/game-data sanity:compare
      - run: pnpm build
      - run: pnpm --filter @pokenexus/game-data test:worker-compat
      - run: pnpm --filter @pokenexus/database test:worker-compat
